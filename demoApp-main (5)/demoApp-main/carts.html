<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carritos Registrados - Confetti Sweets</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="Index.html">
        <i class="bi bi-balloon-heart-fill me-2"></i> Confetti Sweets
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="Index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="carts.html">Historial Carritos</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <section class="py-5 my-5">
    <div class="container mt-5">
      <div class="text-center mb-5">
        <h2 class="display-5 fw-bold" style="color: var(--dark-pink);">Carritos Registrados</h2>
        <p class="lead text-muted">Historial de compras registradas en el sistema</p>
      </div>

      <div class="table-responsive shadow-sm rounded-3">
        <table class="table table-hover table-striped align-middle bg-white mb-0">
          <thead class="text-white" style="background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));">
            <tr>
              <th scope="col" class="py-3 px-4">ID del Carrito</th>
              <th scope="col" class="py-3">ID del Usuario</th>
              <th scope="col" class="py-3">Fecha de Registro</th>
              <th scope="col" class="py-3">Cantidad de Productos</th>
            </tr>
          </thead>
          <tbody id="cartsTableBody">
            <tr><td colspan="4" class="text-center py-4">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <script src="./carts.js"></script>
</body>
</html>
